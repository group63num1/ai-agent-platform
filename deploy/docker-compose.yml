version: "3.8"

services:
  mysql:
    container_name: ${PROJECT_NAME:-ai-agent}-mysql
    image: mysql:8
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-demo_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/backend_init/demo_db.sql:/docker-entrypoint-initdb.d/01_demo_db.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  phpmyadmin:
    container_name: ${PROJECT_NAME:-ai-agent}-phpmyadmin
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 50M
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  # ================ AI 独立数据库 ================
  mysql-ai:
    container_name: ${PROJECT_NAME:-ai-agent}-mysql-ai
    image: mysql:8
    restart: unless-stopped
    ports:
      - "${AI_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${AI_MYSQL_DATABASE:-new_db}
      MYSQL_ROOT_PASSWORD: ${AI_MYSQL_ROOT_PASSWORD:-123456}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-ai-data:/var/lib/mysql
      - ../database/sql/mysql2.sql:/docker-entrypoint-initdb.d/01_new_db.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  phpmyadmin-ai:
    container_name: ${PROJECT_NAME:-ai-agent}-phpmyadmin-ai
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_AI_PORT:-8082}:80"
    environment:
      PMA_HOST: mysql-ai
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 50M
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - app-network
    depends_on:
      mysql-ai:
        condition: service_healthy

  backend:
    container_name: ${PROJECT_NAME:-ai-agent}-backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${PROJECT_NAME:-health-agent}-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:28080"
    environment:
      # 激活生产环境配置
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      
      # 数据库配置（连接 mysql 服务）
      DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-demo_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DATASOURCE_USERNAME: root
      DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      
      # AI Agent 调用地址（通过 Docker 服务名访问）
      AI_AGENT_BASE_URL: http://ai-agent:8000
      
      # Java 运行参数
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1g}
      
      # 时区
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend-logs:/app/logs
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
    # ⚠️ 不配置 healthcheck（除非项目有 Actuator)

  # ==================== AI Agent 服务 ====================
  ai-agent:
    container_name: ${PROJECT_NAME:-ai-agent}-ai-agent
    build:
      context: ../ai-agent
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    image: ${PROJECT_NAME:-ai-agent}-ai-agent:latest
    restart: unless-stopped
    ports:
      - "${AI_AGENT_PORT:-8000}:8000"
    environment:
      # 服务配置
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${AI_AGENT_DEBUG:-false}
      LOG_LEVEL: ${AI_AGENT_LOG_LEVEL:-INFO}
      
      # 数据库配置（连接独立的 mysql-ai 服务）
      DATABASE_TYPE: mysql
      DATABASE_HOST: mysql-ai
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ${AI_MYSQL_ROOT_PASSWORD:-123456}
      DATABASE_NAME: ${AI_MYSQL_DATABASE:-new_db}
      DATABASE_POOL_SIZE: ${AI_AGENT_DB_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${AI_AGENT_DB_MAX_OVERFLOW:-10}
      
      # Java 后端配置
      JAVA_BACKEND_URL: http://backend:28080
      JAVA_BACKEND_TIMEOUT: ${AI_AGENT_BACKEND_TIMEOUT:-30}
      
      # RAG 配置
      CORPUS_PATH: /app/corpus
      CHUNK_SIZE: ${AI_AGENT_CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${AI_AGENT_CHUNK_OVERLAP:-200}
      RETRIEVAL_K: ${AI_AGENT_RETRIEVAL_K:-3}
      
      # Agent 配置
      MAX_ITERATIONS: ${AI_AGENT_MAX_ITERATIONS:-5}
      MAX_HISTORY_LENGTH: ${AI_AGENT_MAX_HISTORY_LENGTH:-20}
      SUMMARY_TRIGGER: ${AI_AGENT_SUMMARY_TRIGGER:-16}
      VERBOSE: ${AI_AGENT_VERBOSE:-true}
      
      # 插件配置
      PLUGIN_TIMEOUT: ${AI_AGENT_PLUGIN_TIMEOUT:-30}
      PLUGIN_MAX_RETRIES: ${AI_AGENT_PLUGIN_MAX_RETRIES:-3}
      
      # CORS 配置
      CORS_ORIGINS: ${AI_AGENT_CORS_ORIGINS:-*}
      MILVUS_ENABLE: ${MILVUS_ENABLE:-true}
      MILVUS_HOST: ${MILVUS_HOST:-milvus-standalone}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-knowledge_base}
      MILVUS_ALIAS: ${MILVUS_ALIAS:-default}
      
      # 时区
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ai-agent-data:/app/data
      - ai-agent-logs:/app/logs
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      mysql-ai:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== 向量数据库（Milvus） ====================
  milvus-etcd:
    container_name: ${PROJECT_NAME:-ai-agent}-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    container_name: ${PROJECT_NAME:-ai-agent}-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MILVUS_MINIO_PORT:-9000}:9000"
      - "${MILVUS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - milvus-minio-data:/minio_data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    container_name: ${PROJECT_NAME:-ai-agent}-milvus-standalone
    image: milvusdb/milvus:v2.6.6
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRIC_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - app-network
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  # ==================== 前端管理端服务 ====================
  web-admin:
    container_name: ${PROJECT_NAME:-ai-agent}-web-admin
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: ${PROJECT_NAME:-ai-agent}-web-admin:latest
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_PORT:-80}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - app-network
    depends_on:
      - backend  # ⭐ 等待后端服务启动（不要求健康检查）


  # ==================== 前端移动端服务 ====================
  # 已删除 mobile 文件夹，注释掉相关配置
  # h5-mobile:
  #   container_name: ${PROJECT_NAME:-ai-agent}-mobile
  #   build:
  #     context: ../mobile
  #     dockerfile: Dockerfile
  #     args:
  #       NODE_ENV: ${NODE_ENV:-production}
  #   image: ${PROJECT_NAME:-ai-agent}-mobile:latest
  #   restart: unless-stopped
  #   ports:
  #     - "${H5_MOBILE_PORT:-81}:80"
  #   environment:
  #     TZ: ${TZ:-Asia/Shanghai}
  #   networks:
  #     - app-network
  #   depends_on:
  #     - backend  # ⭐ 等待后端服务启动（不要求健康检查）


networks:
  app-network:
    driver: bridge
    name: ${PROJECT_NAME:-ai-agent}-network

volumes:
  backend-logs:
    driver: local
  mysql-data:
    driver: local
    name: ${PROJECT_NAME:-ai-agent}-mysql-data
  mysql-ai-data:
    driver: local
    name: ${PROJECT_NAME:-ai-agent}-mysql-ai-data
  ai-agent-data:
    driver: local
    name: ${PROJECT_NAME:-ai-agent}-ai-agent-data
  ai-agent-logs:
    driver: local
    name: ${PROJECT_NAME:-ai-agent}-ai-agent-logs
  milvus-etcd-data:
    driver: local
    name: ${PROJECT_NAME:-ai-agent}-milvus-etcd-data
  milvus-minio-data:
    driver: local
    name: ${PROJECT_NAME:-ai-agent}-milvus-minio-data
  milvus-data:
    driver: local
    name: ${PROJECT_NAME:-ai-agent}-milvus-data
